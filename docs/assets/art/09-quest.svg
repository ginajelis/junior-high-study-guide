  <circle cx="244" cy="358" r="36" fill="#BCAC86" stroke="#37322C" stroke-width="8"/><text x="244" y="369" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#37322C">2</text>
  <circle cx="382" cy="430" r="36" fill="#BCAC86" stroke="#37322C" stroke-width="8"/><text x="382" y="441" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#37322C">3</text>
  <circle cx="510" cy="318" r="36" fill="#F7F3EC" stroke="#37322C" stroke-width="8"/><text x="510" y="329" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#37322C">4</text>
  <circle cx="640" cy="400" r="36" fill="#F7F3EC" stroke="#37322C" stroke-width="8"/><text x="640" y="411" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#37322C">5</text>
  <circle cx="768" cy="296" r="36" fill="#F7F3EC" stroke="#37322C" stroke-width="8"/><text x="768" y="307" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#37322C">6</text>
  <circle cx="892" cy="372" r="36" fill="#F7F3EC" stroke="#37322C" stroke-width="8"/><text x="892" y="383" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" text-anchor="middle" fill="#37322C">7</text>

