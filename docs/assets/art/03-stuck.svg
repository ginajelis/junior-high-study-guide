<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 563" role="img" aria-label="快倒下來的書堆，和躲在後面冒冷汗的學生">
<defs>
  <pattern id="tone" width="14" height="14" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="4" r="2.6" fill="#37322C" opacity=".20"/>
    <circle cx="11" cy="11" r="2.6" fill="#37322C" opacity=".20"/>
  </pattern>
  <pattern id="toneFine" width="9" height="9" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.5" fill="#37322C" opacity=".16"/>
    <circle cx="7.5" cy="7.5" r="1.5" fill="#37322C" opacity=".16"/>
  </pattern>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"
           patternTransform="rotate(35)">
    <rect width="4" height="12" fill="#37322C" opacity=".13"/>
  </pattern>
  <radialGradient id="focus" cx="50%" cy="45%" r="62%">
    <stop offset="55%" stop-color="#9DABBB" stop-opacity="0"/>
    <stop offset="100%" stop-color="#9DABBB" stop-opacity=".38"/>
  </radialGradient>
  <clipPath id="frame"><rect x="0" y="0" width="1000" height="563" rx="0"/></clipPath>
</defs>
  <rect width="1000" height="563" fill="#EDEAE3"/>
  <rect width="1000" height="563" fill="url(#toneFine)"/>
  <line x1="60" y1="90" x2="142.5" y2="90" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>
  <line x1="60" y1="112" x2="169.5" y2="112" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>
  <line x1="60" y1="134" x2="196.5" y2="134" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>
  <line x1="60" y1="156" x2="149.25" y2="156" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>
  <line x1="60" y1="178" x2="176.25" y2="178" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>
  <line x1="60" y1="200" x2="203.25" y2="200" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>
  <line x1="800" y1="90" x2="882.5" y2="90" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>
  <line x1="800" y1="112" x2="909.5" y2="112" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>
  <line x1="800" y1="134" x2="936.5" y2="134" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>
  <line x1="800" y1="156" x2="889.25" y2="156" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>
  <line x1="800" y1="178" x2="916.25" y2="178" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>
  <line x1="800" y1="200" x2="943.25" y2="200" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".2"/>

  <!-- leaning stack -->
  <g stroke="#37322C" stroke-width="7" stroke-linejoin="round">
    <rect x="330" y="452" width="330" height="46" rx="6" fill="#8A6450"/>
    <rect x="346" y="406" width="300" height="46" rx="6" fill="#F7F3EC" transform="rotate(-2 496 429)"/>
    <rect x="336" y="360" width="318" height="46" rx="6" fill="#9DABBB" transform="rotate(2.5 495 383)"/>
    <rect x="356" y="314" width="286" height="46" rx="6" fill="#A3B2A4" transform="rotate(-3.5 499 337)"/>
    <rect x="344" y="268" width="300" height="46" rx="6" fill="#C2A08A" transform="rotate(4.5 494 291)"/>
    <rect x="372" y="222" width="254" height="46" rx="6" fill="#F7F3EC" transform="rotate(-5.5 499 245)"/>
  </g>

  <!-- loose sheets flying off -->
  <g stroke="#37322C" stroke-width="6" stroke-linejoin="round" fill="#FFFFFF">
    <path d="M662 206 l86 -34 26 60 -86 34 z" transform="rotate(14 704 226)"/>
    <path d="M226 250 l86 34 -26 60 -86 -34 z" transform="rotate(-10 268 292)"/>
  </g>

  <!-- wobble marks -->
  <g stroke="#37322C" stroke-width="6" stroke-linecap="round" opacity=".5">
    <path d="M300 210 q-16 -18 -6 -38" fill="none"/>
    <path d="M700 186 q16 -18 6 -38" fill="none"/>
  </g>

  <!-- kid peering out from behind -->
  <g>
    <path d="M676 563 q6 -96 108 -96 q102 0 108 96 z" fill="#5F7263" stroke="#37322C" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="784" cy="412" r="62" fill="#EFD9C6" stroke="#37322C" stroke-width="7"/>
    <path d="M784 350 q64 0 62 66 q-16 -30 -62 -30 q-46 0 -62 30 q-2 -66 62 -66 z" fill="#3E3630" stroke="#37322C" stroke-width="6" stroke-linejoin="round"/>
    <!-- worried eyes -->
    <path d="M756 412 q10 -12 20 0" fill="none" stroke="#37322C" stroke-width="7" stroke-linecap="round"/>
    <path d="M792 412 q10 -12 20 0" fill="none" stroke="#37322C" stroke-width="7" stroke-linecap="round"/>
    <path d="M772 444 q12 -10 24 0" fill="none" stroke="#37322C" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path d="M 836 356 c 5.699999999999999 8.549999999999999 9.5 13.299999999999999 9.5 19.0 a 9.5 9.5 0 0 1 -19.0 0 c 0 -5.699999999999999 3.8 -10.45 9.5 -19.0 z" fill="#8FB6C9" stroke="#37322C" stroke-width="3.04" stroke-linejoin="round"/>
  <path d="M 714 372 c 4.199999999999999 6.3 7.0 9.799999999999999 7.0 14.0 a 7.0 7.0 0 0 1 -14.0 0 c 0 -4.199999999999999 2.8 -7.699999999999999 7.0 -14.0 z" fill="#8FB6C9" stroke="#37322C" stroke-width="2.2399999999999998" stroke-linejoin="round"/>

</svg>
