<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 563" role="img" aria-label="左邊堆疊的方塊，右邊逐漸飄散的方塊">
<defs>
  <pattern id="tone" width="14" height="14" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="4" r="2.6" fill="#37322C" opacity=".20"/>
    <circle cx="11" cy="11" r="2.6" fill="#37322C" opacity=".20"/>
  </pattern>
  <pattern id="toneFine" width="9" height="9" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.5" fill="#37322C" opacity=".16"/>
    <circle cx="7.5" cy="7.5" r="1.5" fill="#37322C" opacity=".16"/>
  </pattern>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"
           patternTransform="rotate(35)">
    <rect width="4" height="12" fill="#37322C" opacity=".13"/>
  </pattern>
  <radialGradient id="focus" cx="50%" cy="45%" r="62%">
    <stop offset="55%" stop-color="#C2A08A" stop-opacity="0"/>
    <stop offset="100%" stop-color="#C2A08A" stop-opacity=".38"/>
  </radialGradient>
  <clipPath id="frame"><rect x="0" y="0" width="1000" height="563" rx="0"/></clipPath>
</defs>
  <rect width="1000" height="563" fill="#F0EBE3"/>

  <!-- left half: debt -->
  <rect x="0" y="0" width="500" height="563" fill="#F3E7DF"/>
  <rect x="0" y="0" width="500" height="563" fill="url(#toneFine)"/>
  <g stroke="#37322C" stroke-width="7" stroke-linejoin="round">
    <rect x="118" y="430" width="270" height="62" rx="8" fill="#C2A08A"/>
    <rect x="148" y="368" width="210" height="62" rx="8" fill="#C2A08A"/>
    <rect x="178" y="306" width="150" height="62" rx="8" fill="#8A6450"/>
    <rect x="206" y="244" width="94" height="62" rx="8" fill="#8A6450"/>
  </g>
  <!-- the crack at the bottom -->
  <path d="M196 492 l22 -34 -18 -6 26 -22" fill="none" stroke="#37322C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#37322C" stroke-width="6" stroke-linecap="round" opacity=".55">
    <path d="M100 402 q-22 -16 -14 -40" fill="none"/>
    <path d="M406 402 q22 -16 14 -40" fill="none"/>
  </g>
  <line x1="318.8" y1="248.6" x2="370.7" y2="252.2" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <line x1="307.7" y1="280.9" x2="350.8" y2="310.0" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <line x1="281.9" y1="303.3" x2="304.7" y2="350.1" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <line x1="248.4" y1="309.8" x2="244.8" y2="361.7" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <line x1="216.1" y1="298.7" x2="187.0" y2="341.8" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <line x1="193.7" y1="272.9" x2="146.9" y2="295.7" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <line x1="187.2" y1="239.4" x2="135.3" y2="235.8" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <line x1="198.3" y1="207.1" x2="155.2" y2="178.0" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <line x1="224.1" y1="184.7" x2="201.3" y2="137.9" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <line x1="257.6" y1="178.2" x2="261.2" y2="126.3" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <line x1="289.9" y1="189.3" x2="319.0" y2="146.2" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <line x1="312.3" y1="215.1" x2="359.1" y2="192.3" stroke="#8A6450" stroke-width="6" stroke-linecap="round" opacity=".5"/>

  <!-- divider -->
  <line x1="500" y1="0" x2="500" y2="563" stroke="#37322C" stroke-width="9"/>

  <!-- right half: accumulation -->
  <rect x="500" y="0" width="500" height="563" fill="#E6EBEF"/>
  <rect x="500" y="0" width="500" height="563" fill="url(#toneFine)"/>
  <g stroke="#37322C" stroke-width="7" stroke-linejoin="round">
    <rect x="556" y="404" width="112" height="74" rx="10" fill="#9DABBB"/>
    <rect x="704" y="428" width="112" height="74" rx="10" fill="#9DABBB" transform="rotate(-7 760 465)"/>
    <rect x="848" y="386" width="112" height="74" rx="10" fill="#5C6D80" transform="rotate(9 904 423)"/>
    <rect x="614" y="256" width="112" height="74" rx="10" fill="#5C6D80" transform="rotate(-12 670 293)" opacity=".78"/>
    <rect x="792" y="222" width="112" height="74" rx="10" fill="#9DABBB" transform="rotate(7 848 259)" opacity=".5"/>
    <rect x="676" y="126" width="112" height="74" rx="10" fill="#9DABBB" transform="rotate(-4 732 163)" opacity=".26"/>
  </g>
  <!-- drifting-away marks -->
  <g stroke="#5C6D80" stroke-width="6" stroke-linecap="round" opacity=".55">
    <line x1="628" y1="104" x2="600" y2="72"/>
    <line x1="744" y1="100" x2="768" y2="66"/>
    <line x1="686" y1="92" x2="686" y2="56"/>
  </g>

</svg>
