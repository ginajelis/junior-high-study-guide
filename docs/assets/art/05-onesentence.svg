  <radialGradient id="focus" cx="50%" cy="45%" r="62%">
    <stop offset="55%" stop-color="#A3B2A4" stop-opacity="0"/>
    <stop offset="100%" stop-color="#A3B2A4" stop-opacity=".38"/>
  </radialGradient>
  <clipPath id="frame"><rect x="0" y="0" width="1000" height="563" rx="0"/></clipPath>
</defs>
  <rect width="1000" height="563" fill="#EDEFE9"/>
