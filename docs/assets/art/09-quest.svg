<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 563" role="img" aria-label="七個關卡的闖關路線圖，終點插著旗子">
<defs>
  <pattern id="tone" width="14" height="14" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="4" r="2.6" fill="#37322C" opacity=".20"/>
    <circle cx="11" cy="11" r="2.6" fill="#37322C" opacity=".20"/>
  </pattern>
  <pattern id="toneFine" width="9" height="9" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.5" fill="#37322C" opacity=".16"/>
    <circle cx="7.5" cy="7.5" r="1.5" fill="#37322C" opacity=".16"/>
  </pattern>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"
           patternTransform="rotate(35)">
    <rect width="4" height="12" fill="#37322C" opacity=".13"/>
  </pattern>
  <radialGradient id="focus" cx="50%" cy="45%" r="62%">
    <stop offset="55%" stop-color="#BCAC86" stop-opacity="0"/>
    <stop offset="100%" stop-color="#BCAC86" stop-opacity=".38"/>
  </radialGradient>
  <clipPath id="frame"><rect x="0" y="0" width="1000" height="563" rx="0"/></clipPath>
</defs>
  <rect width="1000" height="563" fill="#EFEADC"/>
  <rect width="1000" height="563" fill="url(#toneFine)"/>
  <line x1="40" y1="60" x2="111.5" y2="60" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".18"/>
  <line x1="40" y1="82" x2="134.89999999999998" y2="82" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".18"/>
  <line x1="40" y1="104" x2="158.3" y2="104" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".18"/>
  <line x1="40" y1="126" x2="117.35000000000001" y2="126" stroke="#37322C" stroke-width="5" stroke-linecap="round" opacity=".18"/>

  <!-- hills behind -->
  <path d="M0 470 q150 -96 300 0 q150 -104 320 0 q160 -96 380 0 v93 h-1000 z" fill="#A3B2A4" opacity=".4"/>

  <!-- the route -->
  <path d="M118 452 Q 181 304 244 358 Q 313 304 382 430 Q 446 264 510 318 Q 575 264 640 400 Q 704 242 768 296 Q 830 242 892 372" fill="none" stroke="#37322C" stroke-width="10" stroke-linecap="round" opacity=".28"/>
