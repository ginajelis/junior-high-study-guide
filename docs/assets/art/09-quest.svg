  <line x1="860.2" y1="325.9" x2="831.9" y2="284.7" stroke="#786A4B" stroke-width="6" stroke-linecap="round" opacity=".45"/>
  <line x1="883.4" y1="316.7" x2="875.7" y2="267.3" stroke="#786A4B" stroke-width="6" stroke-linecap="round" opacity=".45"/>
  <line x1="908.2" y1="318.4" x2="922.7" y2="270.6" stroke="#786A4B" stroke-width="6" stroke-linecap="round" opacity=".45"/>
